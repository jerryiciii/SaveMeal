name: savemeal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-savemeal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-savemeal}
      POSTGRES_DB: ${POSTGRES_DB:-savemeal}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-savemeal} -d ${POSTGRES_DB:-savemeal}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
